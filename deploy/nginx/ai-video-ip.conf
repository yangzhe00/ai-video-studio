server {
    listen 80;
    server_name 39.108.55.176;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/ai-video-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 39.108.55.176;
    ssl_certificate /etc/nginx/cert/ai-video-ip.pem;
    ssl_certificate_key /etc/nginx/cert/ai-video-ip.key;
    root /usr/share/nginx/html/ai-video-studio;
    index index.html;
    include /etc/nginx/conf.d/ai-video-security-headers.inc;

    location /api/ {
        include /etc/nginx/conf.d/ai-video-security-headers.inc;
        proxy_pass http://172.23.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        client_body_timeout 30s;
        client_max_body_size 20m;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /studio { return 301 /studio/; }
    location ^~ /studio/assets/ {
        include /etc/nginx/conf.d/ai-video-security-headers.inc;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /studio/ {
        include /etc/nginx/conf.d/ai-video-security-headers.inc;
        try_files $uri $uri/ /studio/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /downloads/latest.json {
        include /etc/nginx/conf.d/ai-video-security-headers.inc;
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }
    location ~ ^/downloads/AI-Video-Studio-[0-9A-Za-z.-]+-macos-arm64\.dmg$ {
        types { application/x-apple-diskimage dmg; }
        default_type application/x-apple-diskimage;
        include /etc/nginx/conf.d/ai-video-security-headers.inc;
        try_files $uri =404;
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /downloads/ { return 404; }

    location ^~ /assets/ {
        include /etc/nginx/conf.d/ai-video-security-headers.inc;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        include /etc/nginx/conf.d/ai-video-security-headers.inc;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
