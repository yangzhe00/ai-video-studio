# Temporary route during the supervised SQLite -> PostgreSQL cutover.
# Restore the reviewed official-site config only after the new API passes checks.
server {
    listen 80;
    server_name 39.108.55.176;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/ai-video-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 39.108.55.176;
    ssl_certificate /etc/nginx/cert/ai-video-ip.pem;
    ssl_certificate_key /etc/nginx/cert/ai-video-ip.key;
    root /usr/share/nginx/html/ai-video-studio;
    index index.html;

    location /api/ {
        default_type application/json;
        add_header Retry-After "600" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"maintenance"}';
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
}
