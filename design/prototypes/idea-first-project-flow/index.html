<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Video Studio · 一句话灵感交互原型</title>
  <style>
    :root{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#2b2a26;background:#f7f2eb;--paper:#fffcf8;--ink:#2b2a26;--muted:#726a62;--line:#d5c5b5;--accent:#b96c4a;--accent-strong:#965036;--soft:#f3e8de;--sidebar:#ede4d9}
    *{box-sizing:border-box}body{margin:0}button,textarea,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d79770;outline-offset:3px}button,.card{transition:background .16s,border-color .16s,transform .16s}button:hover:not(:disabled){transform:translateY(-1px)}
    .app{min-height:100vh;display:grid;grid-template-columns:226px minmax(0,1fr)}.rail{background:var(--sidebar);border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:24px}.brand{font-size:19px;font-weight:800;color:var(--accent-strong);letter-spacing:-.04em;padding:5px}.brand span{font-size:23px;margin-right:8px}.rail nav{display:grid;gap:7px}.nav{border:0;background:transparent;color:#5c5650;border-radius:9px;text-align:left;padding:12px 13px;font-weight:650}.nav.active{background:#f8eee4;color:var(--accent-strong);box-shadow:inset 3px 0 var(--accent)}.rail-bottom{margin-top:auto;font-size:12px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);padding:18px 7px 0}.shell{min-width:0}.top{height:65px;background:#f2eee8;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:12px}.crumb{color:#655f59;font-size:13px}.top-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.tag{border:1px solid var(--line);padding:6px 10px;border-radius:99px;background:var(--paper)}main{max-width:1260px;margin:auto;padding:54px 56px 90px}.eyebrow{display:inline-block;color:var(--accent-strong);font-size:12px;font-weight:750;letter-spacing:.04em;background:var(--soft);border-radius:99px;padding:9px 14px}.hero h1{font-size:clamp(36px,4.8vw,68px);line-height:1.13;letter-spacing:-.06em;margin:22px 0 16px;max-width:850px}.lead{font-size:17px;line-height:1.8;color:var(--muted);max-width:700px;margin:0}.home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:22px;margin-top:38px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:26px}.panel h2{font-size:21px;margin:0 0 8px;letter-spacing:-.03em}.panel p{color:var(--muted);line-height:1.65;margin:0 0 18px}.idea-box{width:100%;min-height:140px;resize:vertical;border:1px solid #cbb8a8;background:#fffdfa;border-radius:12px;padding:17px 18px;color:var(--ink);font-size:17px;line-height:1.7}.idea-box.small{min-height:102px}.examples{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}.example{border:1px solid var(--line);background:transparent;color:#77695e;border-radius:99px;padding:8px 12px;font-size:12px}.row{display:flex;gap:11px;align-items:center;flex-wrap:wrap}.primary,.secondary,.quiet{border-radius:10px;padding:12px 18px;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:white}.primary:hover:not(:disabled){background:var(--accent-strong)}.secondary{background:var(--paper);color:var(--accent-strong);border-color:var(--line)}.quiet{background:transparent;color:var(--muted);border-color:transparent}.micro{font-size:12px;color:var(--muted);line-height:1.55}.recent-media{height:160px;background:linear-gradient(125deg,#8e9b91,#d0a987 55%,#987866);border-radius:10px;position:relative;overflow:hidden;margin:18px 0}.recent-media:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:#ffe7ba9a;filter:blur(22px);left:50%;top:12px}.recent-media span{position:absolute;color:white;font-size:12px;font-weight:800;left:17px;top:14px;z-index:1}.project-link{border:0;background:none;color:var(--accent-strong);font-weight:700;padding:0}.film{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:#242421;padding:18px;border-radius:15px;margin-top:54px}.film i{height:125px;border-radius:7px;background:linear-gradient(135deg,#b8987e,#768f8e)}.film i:nth-child(2){background:linear-gradient(135deg,#d2b38e,#897d76)}.film i:nth-child(3){background:linear-gradient(135deg,#526b70,#b2917d)}.film i:nth-child(4){background:linear-gradient(135deg,#b9866d,#557d83)}
    .subhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.subhead h1{font-size:clamp(30px,3.2vw,45px);letter-spacing:-.055em;line-height:1.22;margin:14px 0 9px}.subhead p{color:var(--muted);line-height:1.7;margin:0}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.idea-card{border:1px solid var(--line);background:var(--paper);border-radius:15px;padding:23px;min-height:295px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:12px}.idea-card:hover,.idea-card.selected{border-color:var(--accent);background:#fff8f0}.idea-card.selected{box-shadow:inset 0 0 0 1px var(--accent)}.idea-card small{color:var(--accent-strong);font-weight:800}.idea-card h3{font-size:22px;letter-spacing:-.03em;margin:0}.idea-card p{font-size:14px;line-height:1.75;color:#625950;margin:0}.idea-card .pick{margin-top:auto;font-weight:750;color:var(--accent-strong)}.edit-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px;align-items:end}.edit-panel textarea{grid-column:1 / -1}.step-note{border-left:3px solid var(--accent);padding:11px 16px;background:#f6eae0;color:#65594e;font-size:13px;line-height:1.6;margin:22px 0}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:23px 0}.project-card{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:21px;text-align:left;color:var(--ink);min-height:175px}.project-card:hover{border-color:var(--accent)}.project-card strong{font-size:20px}.project-card p{font-size:13px;color:var(--muted);margin:16px 0 0}.project-card em{font-style:normal;font-size:11px;color:#657b63;background:#edf3eb;padding:5px 8px;border-radius:99px}.project-card.local em{color:#91643b;background:#f8eddc}.search{width:270px;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--paper)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin:24px 0}.field{display:grid;gap:8px;color:#5c554e;font-size:13px;font-weight:700}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;background:#fffdfa;padding:12px 13px;color:var(--ink)}.message{margin-top:16px;padding:12px 15px;border-radius:9px;background:#f6e8dd;color:#77513e;font-size:13px}.success{background:#eaf2ea;color:#49674d}.overlay{position:fixed;inset:0;background:#17141080;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal{background:var(--paper);border-radius:17px;border:1px solid var(--line);padding:30px;width:min(480px,100%);box-shadow:0 25px 80px #1f160f40}.modal h2{margin:0 0 9px}.modal p{color:var(--muted);line-height:1.65}.modal .row{justify-content:flex-end;margin-top:20px}.empty{border:1px dashed var(--line);border-radius:14px;padding:33px;text-align:center;background:#fffaf5}.empty h3{margin:0 0 8px}.empty p{color:var(--muted)}.hidden{display:none!important}
    @media(max-width:850px){.app{grid-template-columns:1fr}.rail{padding:10px 16px;flex-direction:row;align-items:center;gap:14px}.rail nav{display:flex}.rail-bottom{display:none}.top{padding:0 18px}main{padding:35px 20px 70px}.home-grid,.three,.project-grid,.split{grid-template-columns:1fr}.hero h1{font-size:42px}.film{grid-template-columns:repeat(2,1fr)}.idea-card{min-height:210px}.edit-panel{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){button,.card{transition:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="rail"><div class="brand"><span>✦</span>AI Video Studio</div><nav aria-label="主导航"><button class="nav active" data-go="home">⌂　首页</button><button class="nav" data-go="projects">▤　全部项目</button></nav><div class="rail-bottom">交互原型<br>演示数据 · 不调用真实模型或视频服务</div></aside>
  <div class="shell"><header class="top"><span class="crumb" id="crumb">首页 / 灵感起点</span><div class="top-right"><span class="tag">网页体验</span><span>演示账号已登录</span></div></header><main id="screen"></main></div>
</div>
<div id="modal-root"></div>
<script>
  const state={page:"home",idea:"",round:0,selected:-1,prompt:"",projects:[{id:"p111",title:"111",status:"cloud"},{id:"p123",title:"123",status:"cloud"}],projectId:null,ideaFlow:false,photoName:"",duration:"5",confirmed:false,notice:""};
  const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const current=()=>state.projects.find(p=>p.id===state.projectId);
  function variants(){const subject=state.idea.trim()||"小狗做饭";const r=state.round%2;return r===0?[
    {name:"温暖叙事",why:"把想法拍成有起承转合的生活瞬间",prompt:`以${subject}为主体，清晨的厨房里，主体先认真准备食物，再抬头看向镜头露出期待的神情。温暖自然光，近景到中景的平稳推镜，动作清楚连贯，保留主体外形特征。`},
    {name:"轻快反转",why:"用一个意外动作做记忆点",prompt:`以${subject}为主体，镜头先拍出一本正经的准备动作，随后出现一个俏皮的小意外，主体停顿半秒后自然化解。明亮厨房，快速但稳定的镜头节奏，最后定格在有趣的反应上，保留主体外形特征。`},
    {name:"电影氛围",why:"突出光线、细节和情绪",prompt:`以${subject}为主体，从手边或道具细节切入，缓慢展现主体完成动作并把成果呈现在镜头前。柔和侧逆光、浅景深、克制的镜头运动，画面有安静而满足的情绪，保留主体外形特征。`}
  ]:[
    {name:"观察式记录",why:"像随手拍到的真实瞬间",prompt:`记录${subject}的自然动作：先展示准备过程，再跟随主体完成关键一步，最后保留一个真实的表情或停顿。自然环境光，手持但稳定的观察视角，主体始终清晰。`},
    {name:"节奏型短片",why:"适合快速抓住注意力",prompt:`围绕${subject}设计一个清晰的动作高潮。开头快速给出主体与场景，中段聚焦动作，结尾用成果特写收束。明快节奏，清楚的景别变化，不出现无关人物或道具。`},
    {name:"治愈特写",why:"让观众记住细节和情绪",prompt:`以${subject}为主体，选择一个最有温度的细节动作进行近景呈现，再慢慢拉开镜头展示完整场景。柔和色彩，安静的背景，动作自然，主体外形稳定。`}
  ]}
  function go(page){state.page=page;state.notice="";render();window.scrollTo(0,0)}
  function render(){const s=document.getElementById("screen");document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.go===state.page));document.getElementById("crumb").textContent=({home:"首页 / 灵感起点",ideas:"首页 / 三种灵感",projects:"首页 / 全部项目",choose:"灵感 / 选择项目",workspace:"项目 / 创作工作台"})[state.page];s.innerHTML=({home:home,ideas:ideas,projects:projects,choose:choose,workspace:workspace})[state.page]();bind();}
  function home(){return `<section class="hero"><span class="eyebrow">先有想法，再决定怎么拍</span><h1>说一句话，<br>让灵感有三个方向。</h1><p class="lead">写下你想拍的人物、动物或场景。先看看三种镜头提示词，再选喜欢的一版去生成视频。</p></section><div class="home-grid"><section class="panel"><h2>今天想拍什么？</h2><p>一句话或几个关键词就可以。此时不会新建项目，也不会提交视频生成。</p><textarea id="idea-input" class="idea-box" maxlength="200" placeholder="例如：小狗做好晚餐，端着盘子开心上菜">${esc(state.idea)}</textarea><div class="examples"><button class="example" data-example="小狗做好晚餐，端着盘子开心上菜">小狗做饭上菜</button><button class="example" data-example="女孩撑伞穿过雨后的街道">雨后街道</button><button class="example" data-example="一杯咖啡从制作到端上桌">咖啡制作</button></div><div class="row"><button class="primary" id="get-ideas">给我三种灵感</button><span class="micro">原型演示三版文案；正式功能需要接入模型</span></div></section><section class="panel"><h2>最近的项目</h2><div class="recent-media"><span>EPISODE 01</span></div><strong>111</strong><p>继续上次的创作，或到项目库查看全部项目。</p><div class="row"><button class="secondary" data-open="p111">继续项目</button><button class="quiet" data-go="projects">查看全部项目</button></div></section></div><div class="film" aria-hidden="true"><i></i><i></i><i></i><i></i></div>`}
  function ideas(){const v=variants();return `<div class="subhead"><div><span class="eyebrow">灵感草案 · 单镜头</span><h1>同一个想法，三种拍法。</h1><p>先看画面方向，再选择一版。你可以修改提示词，视频生成会在后面单独确认。</p></div><button class="secondary" data-go="home">返回修改想法</button></div><section class="panel"><div class="field"><label for="idea-revise">你的想法</label><input id="idea-revise" value="${esc(state.idea)}" maxlength="200"></div><div class="row" style="margin-top:16px"><button class="secondary" id="regen">再给我三版</button><span class="micro">原型仅演示交互；不代表真实 Agent 已上线</span></div></section><div class="three">${v.map((x,i)=>`<button class="idea-card ${state.selected===i?"selected":""}" data-select="${i}" aria-pressed="${state.selected===i}"><small>方向 ${i+1}</small><h3>${esc(x.name)}</h3><p>${esc(x.why)}</p><p>${esc(x.prompt)}</p><span class="pick">${state.selected===i?"✓ 已选中":"选择这一版"}</span></button>`).join("")}</div>${state.selected>=0?`<section class="panel edit-panel"><div><h2>把这一版改成你的镜头</h2><p>这里的文字会成为后续生成计划的输入。</p></div><span class="micro">最多 2000 字</span><textarea class="idea-box small" id="prompt-edit" maxlength="2000">${esc(state.prompt)}</textarea><button class="primary" id="continue-idea">继续选择项目</button><span class="micro">此操作不会消耗视频额度</span></section>`:`<div class="step-note">选中一版后可修改；还没有发起视频生成。</div>`}`}
  function projects(){return `<div class="subhead"><div><span class="eyebrow">项目库</span><h1>我的项目</h1><p>首页只保留最近项目。全部项目、创建和查找都在这里完成。</p></div><button class="primary" id="new-project">＋ 新建项目</button></div><div class="toolbar"><input class="search" id="project-search" placeholder="搜索项目名称" aria-label="搜索项目"><button class="secondary" id="refresh-projects">刷新列表</button><span class="micro" id="project-count">${state.projects.length} 个项目</span></div><div class="project-grid" id="project-grid">${projectCards()}</div>${state.notice?`<p class="message success">${esc(state.notice)}</p>`:""}`}
  function projectCards(filter=""){const list=state.projects.filter(p=>p.title.toLowerCase().includes(filter.toLowerCase()));return list.length?list.map(p=>`<button class="project-card ${p.status==='local'?'local':''}" data-open="${esc(p.id)}"><em>${p.status==='local'?'仅保存在本机':'云端项目'}</em><h3>${esc(p.title)}</h3><p>第 1 集 · 0 个镜头</p><span class="pick">打开项目 →</span></button>`).join(""):`<div class="empty"><h3>没有找到项目</h3><p>换个关键词，或新建一个项目。</p></div>`}
  function choose(){return `<div class="subhead"><div><span class="eyebrow">已选镜头方向</span><h1>这条灵感放在哪个项目？</h1><p>选择已有项目，或明确新建。不会自动创建无名项目。</p></div><button class="secondary" data-go="ideas">返回三种灵感</button></div><div class="panel"><h2>最终镜头提示词</h2><p>${esc(state.prompt)}</p></div><div class="project-grid">${projectCards()}<button class="project-card" id="new-project"><strong>＋ 新建项目</strong><p>给这条灵感一个清楚的归属，然后继续选择照片。</p></button></div>`}
  function workspace(){const p=current();return `<div class="subhead"><div><span class="eyebrow">${esc(p?.title||'项目')} / 第 1 集</span><h1>${state.ideaFlow?'准备生成这个镜头':'开始这个项目的第一条创作'}</h1><p>${p?.status==='local'?'仅保存在本机；登录并关联云端后才能在网页看到。':'当前是云端项目。选择照片与分集后再确认生成。'}</p></div><button class="secondary" data-go="projects">返回项目库</button></div>${state.ideaFlow?`<section class="panel"><h2>已选的镜头提示词</h2><textarea class="idea-box small" id="workspace-prompt" maxlength="2000">${esc(state.prompt)}</textarea><div class="split"><label class="field">目标分集<select id="episode"><option>第 1 集</option></select></label><label class="field">镜头时长<select id="duration"><option value="5" ${state.duration==='5'?'selected':''}>5 秒</option><option value="10" ${state.duration==='10'?'selected':''}>10 秒</option></select></label></div><label class="field">参考照片<input type="file" id="photo" accept="image/png,image/jpeg"></label><div class="step-note">选定提示词和照片都不会自动生成。点击下方按钮会先显示额度确认。</div><button class="primary" id="review-run">检查并确认生成</button>${state.notice?`<p class="message">${esc(state.notice)}</p>`:''}</section>`:`<div class="empty"><h3>项目已创建</h3><p>从一句想法开始，让 Agent 提供三个镜头方向。</p><button class="primary" data-go="home">写一句想法</button></div>`}${state.confirmed?`<p class="message success">原型已模拟提交一条视频任务。正式产品会在这里显示真实任务状态和结果。</p>`:''}`}
  function modal(){document.getElementById('modal-root').innerHTML=`<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="新建项目"><h2>新建项目</h2><p>给项目起个名字。创建后进入项目工作台，不把新项目直接铺在首页。</p><label class="field">项目名称<input id="new-name" maxlength="50" placeholder="例如：小狗的晚餐"></label><div class="row"><button class="quiet" id="cancel-modal">取消</button><button class="primary" id="submit-project">创建并继续</button></div></section></div>`;document.getElementById('new-name').focus();document.getElementById('cancel-modal').onclick=closeModal;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};document.getElementById('submit-project').onclick=()=>{const name=document.getElementById('new-name').value.trim();if(!name){document.getElementById('new-name').focus();return}const id='p'+Date.now();state.projects.unshift({id,title:name,status:'cloud'});state.projectId=id;closeModal();go('workspace')};document.getElementById('new-name').onkeydown=e=>{if(e.key==='Enter')document.getElementById('submit-project').click()}}
  function closeModal(){document.getElementById('modal-root').innerHTML=''}
  function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.projectId=b.dataset.open;go('workspace')});document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{state.idea=b.dataset.example;render();document.getElementById('idea-input').focus()});const input=document.getElementById('idea-input');if(input)input.oninput=e=>state.idea=e.target.value;const gi=document.getElementById('get-ideas');if(gi)gi.onclick=()=>{state.idea=document.getElementById('idea-input').value.trim();if(!state.idea){input.focus();return}state.selected=-1;state.ideaFlow=true;go('ideas')};const revise=document.getElementById('idea-revise');if(revise)revise.oninput=e=>state.idea=e.target.value;const regen=document.getElementById('regen');if(regen)regen.onclick=()=>{state.idea=revise.value.trim();if(!state.idea){revise.focus();return}state.round++;state.selected=-1;state.prompt='';render()};document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.select);state.prompt=variants()[state.selected].prompt;render()});const pe=document.getElementById('prompt-edit');if(pe)pe.oninput=e=>state.prompt=e.target.value;const cont=document.getElementById('continue-idea');if(cont)cont.onclick=()=>{state.prompt=document.getElementById('prompt-edit').value.trim();if(!state.prompt){pe.focus();return}go('choose')};const np=document.getElementById('new-project');if(np)np.onclick=modal;const search=document.getElementById('project-search');if(search)search.oninput=e=>{document.getElementById('project-grid').innerHTML=projectCards(e.target.value);document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.projectId=b.dataset.open;go('workspace')})};const refresh=document.getElementById('refresh-projects');if(refresh)refresh.onclick=()=>{state.notice='演示项目列表已刷新。正式产品会重新读取云端项目。';render()};const duration=document.getElementById('duration');if(duration)duration.onchange=e=>state.duration=e.target.value;const photo=document.getElementById('photo');if(photo)photo.onchange=e=>state.photoName=e.target.files?.[0]?.name||'';const wprompt=document.getElementById('workspace-prompt');if(wprompt)wprompt.oninput=e=>state.prompt=e.target.value;const review=document.getElementById('review-run');if(review)review.onclick=()=>{state.prompt=wprompt.value.trim();if(!state.prompt){state.notice='请先填写镜头提示词。';render();return}if(!state.photoName){state.notice='请先选择 JPG 或 PNG 参考照片。';render();return}document.getElementById('modal-root').innerHTML=`<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="确认生成"><h2>确认生成这个镜头</h2><p>参考照片：${esc(state.photoName)}<br>时长：${esc(state.duration)} 秒<br>将消耗 1 次视频演示额度。</p><p class="micro">本原型只模拟确认，不提交真实任务。</p><div class="row"><button class="quiet" id="cancel-modal">返回修改</button><button class="primary" id="confirm-run">确认生成</button></div></section></div>`;document.getElementById('cancel-modal').onclick=closeModal;document.getElementById('confirm-run').onclick=()=>{state.confirmed=true;closeModal();render()}}}
  render();
