<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Video Studio｜整集可视化时间线原型</title>
  <style>
    :root{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#272b29;background:#ece7df;--paper:#f8f5ef;--card:#fffdf9;--ink:#272b29;--muted:#6e736f;--line:#d8d0c4;--rust:#a7573e;--rust2:#86432f;--teal:#467c76;--teal-light:#badbd3;--gold:#c9a663;--stage:#202a2d;--stage2:#29373a;--cream:#e9e2d8}
    *{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d28c6b;outline-offset:2px}button{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-weight:650}button:hover:not(:disabled){border-color:#a98c76}input,select,textarea{color:var(--ink)}.primary{background:var(--rust);color:#fff;border-color:var(--rust)}.primary:hover:not(:disabled){background:var(--rust2)}.quiet{background:transparent}.tiny{font-size:12px;padding:7px 9px}.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid #cfb89e;border-radius:99px;background:#fff6e9;color:#744632;font-size:11px;font-weight:750}.dot{width:6px;height:6px;background:#55a18d;border-radius:50%}
    .app{min-height:100vh;display:grid;grid-template-rows:66px minmax(0,1fr)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;background:#f7f1e8;border-bottom:1px solid #d3c8bb}.top-left,.top-actions{display:flex;align-items:center;gap:10px;min-width:0}.brand{font-size:17px;font-weight:850;letter-spacing:-.04em;color:var(--rust2);white-space:nowrap}.brand-mark{font-size:22px;margin-right:6px}.slash{color:#aaa093}.breadcrumb{font-size:13px;color:#5e635e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions button{padding:9px 12px;white-space:nowrap}.save{font-size:12px;color:#587369;min-width:61px;text-align:center}.save.failed{color:#a13e2e}.prototype-label{font-size:11px;color:#7a6253;border-left:1px solid #cbbba7;padding-left:11px;white-space:nowrap}
    .workspace{display:grid;grid-template-columns:224px minmax(560px,1fr) 260px;min-height:0;max-height:calc(100vh - 66px)}.assets{background:#f1ebe2;border-right:1px solid var(--line);overflow:auto;padding:22px 15px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:12px}.panel-title h2{font-size:14px;margin:0}.panel-title small{font-size:11px;color:var(--muted)}.assets p,.inspector p{font-size:12px;color:var(--muted);line-height:1.55}.asset-group{margin:22px 0 0}.asset-group h3{font-size:12px;color:#6c635a;font-weight:750;margin:0 0 8px}.asset{width:100%;display:grid;grid-template-columns:35px minmax(0,1fr) 25px;align-items:center;gap:8px;text-align:left;padding:9px;margin:6px 0;border-radius:8px;background:#fffcf7}.asset-icon{height:32px;border-radius:6px;display:grid;place-items:center;background:#d8e5df;color:#2c625a;font-size:15px}.asset.music .asset-icon{background:#eadfc9;color:#80602b}.asset span:not(.asset-icon){min-width:0}.asset strong,.asset small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.asset strong{font-size:12px}.asset small{font-size:10px;color:var(--muted);margin-top:3px}.asset b{font-size:18px;color:#99654d;text-align:right}.asset-actions{display:grid;gap:8px;margin-top:14px}.asset-actions button{width:100%;padding:10px 8px;text-align:left;font-size:12px}.tip{margin-top:16px;background:#e7eee8;color:#345d55;font-size:11px;line-height:1.55;padding:11px;border-radius:8px}.demo-tools{border-top:1px solid var(--line);margin-top:20px;padding-top:15px}.demo-tools button{display:block;margin:6px 0;width:100%;text-align:left;font-size:11px;padding:7px}
    .main{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(290px,43%) minmax(330px,57%);background:var(--paper)}.viewer{padding:16px 24px 13px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;min-height:0}.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.viewer-head h1{font-size:19px;letter-spacing:-.035em;margin:0}.viewer-head p{font-size:11px;color:var(--muted);margin:3px 0 0}.viewer-head small{color:#646965;font-size:12px}.video-stage{position:relative;overflow:hidden;background:var(--stage);border-radius:10px;min-height:0;display:grid;place-items:center}.frame{height:100%;aspect-ratio:9/16;max-width:100%;position:relative;overflow:hidden;background:linear-gradient(155deg,#6b837f,#354f58);display:grid;place-items:center}.frame.scene-1{background:linear-gradient(150deg,#927459,#5e4339)}.frame.scene-2{background:linear-gradient(150deg,#708b83,#355264)}.frame:before{content:"";position:absolute;width:160%;height:55%;left:-30%;bottom:-18%;border-radius:50%;background:#332e2b70}.window{position:absolute;top:11%;left:13%;width:30%;height:24%;border:7px solid #d5c0a5;background:#a2b4ac66}.lamp{position:absolute;top:0;right:20%;width:3px;height:26%;background:#d9bb8b}.lamp:after{content:"";position:absolute;top:90%;left:-25px;width:53px;height:21px;border-radius:50% 50% 20% 20%;background:#e4c995}.character{font-size:clamp(60px,9vh,130px);z-index:2;transform:translateY(12%);filter:drop-shadow(0 10px 14px #18252455)}.prop{position:absolute;z-index:3;bottom:18%;font-size:clamp(42px,7vh,90px)}.frame-caption{position:absolute;z-index:4;bottom:6%;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 4px #000}.stage-label{position:absolute;top:12px;left:14px;font-size:11px;color:#fff;background:#192426b8;padding:6px 9px;border-radius:6px}.stage-hint{position:absolute;right:14px;bottom:13px;font-size:11px;color:#dce3dd;background:#172426c9;padding:6px 9px;border-radius:6px}.transport{display:flex;align-items:center;gap:13px}.transport button{border:0;background:#29373a;color:#fff;border-radius:50%;width:34px;height:34px;font-size:15px}.transport .clock{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;color:#5b605c}.transport input[type=range]{flex:1;accent-color:var(--rust)}.transport .speed{font-size:11px;color:#6c6f69}
    .timeline{background:#263135;color:#e5e9e4;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;border-top:1px solid #152125}.timeline-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-bottom:1px solid #405053}.timeline-tools h2{font-size:14px;margin:0}.timeline-tools span{font-size:11px;color:#b3c2be}.timeline-tools button{background:#3b4b4e;border-color:#596668;color:#f5f5ef;padding:6px 9px;font-size:11px}.timeline-scroll{overflow-x:auto;overflow-y:auto;padding:0 18px 13px}.tracks{min-width:560px;position:relative}.ruler-row,.track-row{display:grid;grid-template-columns:78px minmax(480px,1fr)}.ruler-row{height:30px;border-bottom:1px solid #506163}.ruler-label{font-size:10px;color:#9cb1ac;padding-top:12px}.ruler{position:relative;cursor:pointer}.tick{position:absolute;top:8px;bottom:0;border-left:1px solid #607174;color:#a6b8b2;font-size:10px;padding-left:5px}.tick.major{border-left-color:#9cafab}.track-row{min-height:63px;border-bottom:1px solid #455457}.track-row.visual{min-height:72px}.track-name{display:flex;align-items:center;font-size:11px;color:#b9c8c3;font-weight:750}.track-lane{position:relative;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(33.333% - 1px),#435357 calc(33.333% - 1px),#435357 33.333%);min-height:62px}.track-row.visual .track-lane{min-height:71px}.visual-clip{position:absolute;top:8px;bottom:8px;border-radius:6px;border:1px solid #a5b7aa;background:#6d8581;color:#fff;padding:7px 9px;overflow:hidden}.visual-clip:nth-child(2){background:#8a6b5c}.visual-clip:nth-child(3){background:#5a7580}.visual-clip strong{display:block;font-size:11px;white-space:nowrap}.visual-clip small{font-size:10px;color:#e3e7e0}.audio-clip{position:absolute;top:8px;height:45px;border:1px solid #91d0c5;border-radius:6px;background:#4c9189;color:white;display:flex;align-items:center;overflow:hidden;touch-action:none;user-select:none;cursor:grab;box-shadow:0 2px 5px #091d1d4a}.audio-clip.music{background:#9b7d48;border-color:#ddc089}.audio-clip.selected{outline:2px solid #fff;outline-offset:2px}.audio-clip .grip{width:9px;align-self:stretch;flex:none;background:#ffffff39;cursor:ew-resize}.audio-clip .body{min-width:0;flex:1;padding:3px 7px;position:relative}.audio-clip strong{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2}.wave{display:flex;align-items:center;gap:2px;height:17px;opacity:.62}.wave i{display:block;width:2px;min-width:2px;background:#d7faf0;border-radius:3px}.music .wave i{background:#fff0c5}.empty-lane{font-size:11px;color:#9aadaa;padding:22px 8px}.playhead{position:absolute;z-index:8;top:30px;bottom:0;border-left:2px solid #ecbd77;pointer-events:none}.playhead:before{content:"";position:absolute;top:-5px;left:-5px;width:10px;height:10px;transform:rotate(45deg);background:#ecbd77}.timeline-note{padding:8px 18px 11px;font-size:11px;color:#bacbc3;border-top:1px solid #405053}.timeline-note strong{color:#f0d3a2}
    .inspector{background:#f3eee6;border-left:1px solid var(--line);padding:21px 16px;overflow:auto}.inspector h2{font-size:14px;margin:0 0 7px}.inspector .selected-title{font-size:12px;color:#3c665e;font-weight:750;margin-bottom:16px}.field{display:grid;gap:5px;margin:13px 0;font-size:11px;color:#5d655f;font-weight:700}.field input,.field select{width:100%;padding:9px;border:1px solid #cfc4b6;border-radius:7px;background:#fffdf9;font-size:13px}.field small{font-size:10px;font-weight:400;color:#85877f}.inspector .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.inspector .row .field{min-width:0}.inspector-actions{display:grid;gap:8px;margin-top:20px}.inspector-actions button{padding:9px}.inspector .callout{padding:11px;background:#e6ede7;color:#3d6459;border-radius:8px;line-height:1.55;font-size:11px;margin-top:16px}.inspector .empty{margin-top:35px;text-align:center;padding:20px 5px}.inspector .empty strong{display:block;font-size:13px;margin-bottom:7px}
    .modal-backdrop{position:fixed;z-index:40;inset:0;background:#101b1fc0;display:grid;place-items:center;padding:18px}.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:#fffaf3;border-radius:13px;border:1px solid #d8c8b6;box-shadow:0 24px 80px #0005;padding:24px}.modal h2{font-size:20px;margin:0 0 9px}.modal p{color:#5e625c;font-size:13px;line-height:1.65}.modal .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:23px}.modal .actions button{padding:10px 14px}.modal textarea{width:100%;min-height:100px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px}.modal select{width:100%;padding:9px;margin-top:7px;border:1px solid var(--line);border-radius:8px}.toast{position:fixed;z-index:30;bottom:20px;right:20px;padding:10px 14px;border-radius:8px;background:#263b3b;color:#fff;box-shadow:0 8px 28px #0003;font-size:12px;max-width:310px}.hidden{display:none!important}
    @media(max-width:1180px){.workspace{grid-template-columns:180px minmax(450px,1fr) 230px}.assets{padding:17px 10px}.inspector{padding:17px 11px}.prototype-label{display:none}}@media(max-width:850px){.app{grid-template-rows:auto 1fr}.topbar{min-height:67px;flex-wrap:wrap;padding:9px 12px}.top-actions{flex-wrap:wrap}.workspace{max-height:none;display:grid;grid-template-columns:1fr}.assets{border-right:0;border-bottom:1px solid var(--line)}.asset-group{display:inline-block;vertical-align:top;min-width:180px;margin-right:14px}.asset-actions{display:flex;flex-wrap:wrap}.asset-actions button{width:auto}.main{min-height:760px;grid-template-rows:350px 410px}.inspector{border-left:0;border-top:1px solid var(--line)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="top-left"><div class="brand"><span class="brand-mark">✦</span>AI Video Studio</div><span class="slash">/</span><span class="breadcrumb">小狗的晚餐 / 第 1 集 / 整集剪辑</span><span class="badge"><span class="dot"></span>交互原型</span></div><div class="top-actions"><span id="save-state" class="save">已保存</span><button class="quiet" data-action="back">返回画布</button><button data-action="undo" id="undo">撤销</button><button data-action="redo" id="redo">重做</button><button data-action="agent">Agent 建议</button><button data-action="precise">精准预览</button><button class="primary" data-action="export">导出成片</button></div></header>
    <div class="workspace">
      <aside class="assets" aria-label="素材库"><div class="panel-title"><h2>素材库</h2><small>拖到下方音轨</small></div><p>录音和音乐在这里准备。生成配音不会自动放入影片。</p><div id="asset-list"></div><div class="asset-actions"><button data-action="upload-voice">＋ 上传自己的录音</button><button data-action="upload-music">＋ 上传背景音乐</button><button data-action="tts">✦ 文字生成配音</button></div><input id="file-input" type="file" accept=".wav,.mp3,.m4a,audio/*" class="hidden"><div class="tip">不会自动扣费。文字配音必须先展示费用说明，再由用户确认。</div><div class="demo-tools"><div class="panel-title"><h2>原型状态</h2><small>仅用于演示</small></div><button data-action="empty">查看空时间线</button><button data-action="offline" id="offline-button">模拟断网保存</button><button data-action="reset">恢复 15 秒示例</button></div></aside>
      <main class="main"><section class="viewer" aria-label="整集预览"><div class="viewer-head"><div><h1>第 1 集 · 小狗的晚餐</h1><p>从画布编排好镜头，在这里对齐配音与画面。</p></div><small id="viewer-meta">3 个镜头 · 15.0 秒</small></div><div class="video-stage" id="video-stage"></div><div class="transport"><button id="play" data-action="play" aria-label="播放或暂停">▶</button><span class="clock" id="current-time">00:00.0</span><input id="scrubber" type="range" min="0" max="15000" step="100" value="0" aria-label="播放头位置"><span class="clock">00:15.0</span><span class="speed">模拟即时试听</span></div></section><section class="timeline" aria-label="统一时间线"><div class="timeline-tools"><h2>整集时间线</h2><div><span>拖动片段定位 · 拖两端裁剪 · 单击时间尺跳转</span> <button data-action="zoom">缩放 100%</button></div></div><div class="timeline-scroll"><div id="tracks" class="tracks"></div></div><div class="timeline-note"><strong>原型说明：</strong>这里演示拖动、对齐、预览状态和异常分支；没有真实声音、云端保存或 MP4 导出。</div></section></main>
      <aside class="inspector" aria-label="片段属性"><div class="panel-title"><h2>片段属性</h2><small>精确到 0.1 秒</small></div><div id="inspector-content"></div></aside>
    </div>
  </div>
  <div id="modal-root"></div><div id="toast" class="toast hidden" role="status"></div>
  <script>
    const total=15000;
    const initialAssets=[{id:"voice-a",kind:"voice",name:"小狗做饭旁白.wav",duration:5500},{id:"voice-b",kind:"voice",name:"上菜啦.mp3",duration:3000},{id:"music-a",kind:"music",name:"温暖厨房.m4a",duration:15000}];
    const initialClips=[{id:"clip-a",assetId:"voice-a",kind:"voice",name:"小狗做饭旁白.wav",start:2200,inMs:0,outMs:5500,volume:1,anchor:"shot-1"},{id:"clip-b",assetId:"voice-b",kind:"voice",name:"上菜啦.mp3",start:10700,inMs:0,outMs:3000,volume:1,anchor:"shot-3"},{id:"clip-m",assetId:"music-a",kind:"music",name:"温暖厨房.m4a",start:0,inMs:0,outMs:15000,volume:.35,anchor:"episode"}];
    const scenes=[{name:"镜头 1 · 准备食材",emoji:"🐶",prop:"🥕",caption:"今天我来做晚餐"},{name:"镜头 2 · 认真翻炒",emoji:"🐶",prop:"🍳",caption:"再翻炒一会儿"},{name:"镜头 3 · 把菜端上桌",emoji:"🐶",prop:"🍲",caption:"上菜啦！"}];
    const state={assets:structuredClone(initialAssets),clips:structuredClone(initialClips),selected:"clip-a",time:0,playing:false,timer:null,save:"已保存",offline:false,empty:false,zoom:1,history:[],future:[],previewRevision:null,revision:1,pendingAsset:null,sourceVolume:1};
    const $=id=>document.getElementById(id);
    const esc=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const sec=ms=>(ms/1000).toFixed(1);
    const clock=ms=>{const s=Math.floor(ms/1000);return "00:"+String(s).padStart(2,"0")+"."+Math.round(ms%1000/100)};
    const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
    const snap=value=>{const v=Math.round(value/100)*100;for(const t of [0,5000,10000,15000])if(Math.abs(t-v)<=180)return t;return v};
    const snapshot=()=>structuredClone(state.clips);
    const selected=()=>state.clips.find(clip=>clip.id===state.selected);
    const duration=clip=>clip.outMs-clip.inMs;
    let saveTimer=0,toastTimer=0,drag=null;
    function notify(message){const node=$("toast");node.textContent=message;node.classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.add("hidden"),3400)}
    function markSave(){state.revision++;state.previewRevision=null;state.save="保存中";updateSave();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{state.save=state.offline?"保存失败":"已保存";updateSave();if(state.offline)notify("网络不可用：改动保留在本页，请恢复连接后重试保存。")},650)}
    function updateSave(){const node=$("save-state");node.textContent=state.save;node.classList.toggle("failed",state.save==="保存失败")}
    function change(mutator){state.history.push(snapshot());state.future=[];mutator();markSave();renderTracks();renderInspector();updateButtons()}
    function renderAssets(){const groups=[["voice","配音录音"],["music","背景音乐"]];$("asset-list").innerHTML=groups.map(group=>'<div class="asset-group"><h3>'+group[1]+'</h3>'+state.assets.filter(a=>a.kind===group[0]).map(a=>'<button class="asset '+(a.kind==="music"?"music":"")+'" draggable="true" data-asset="'+esc(a.id)+'" title="拖入'+group[1]+'轨，或点击在播放头处加入"><span class="asset-icon">'+(a.kind==="music"?"♫":"◉")+'</span><span><strong>'+esc(a.name)+'</strong><small>'+sec(a.duration)+' 秒 · 拖入时间线</small></span><b>＋</b></button>').join("")+'</div>').join("")}
    function wave(){return '<span class="wave" aria-hidden="true">'+Array.from({length:30},(_,i)=>'<i style="height:'+(5+Math.round((Math.sin(i*1.5)+1)*5+(i*11%7)))+'px"></i>').join("")+'</span>'}
    function renderTracks(){const ruler='<div class="ruler-row"><div class="ruler-label">时间 / 秒</div><div class="ruler" id="ruler">'+[0,5,10,15].map(t=>'<span class="tick major" style="left:'+(t/15*100)+'%">'+String(t).padStart(2,"0")+'</span>').join("")+'</div></div>';const visuals='<div class="track-row visual"><div class="track-name">画面</div><div class="track-lane">'+(state.empty?'<span class="empty-lane">还没有镜头。返回画布加入镜头后，在这里添加配音。</span>':scenes.map((s,i)=>'<div class="visual-clip" style="left:'+(i/3*100)+'%;width:calc(33.333% - 3px)"><strong>'+esc(s.name)+'</strong><small>'+clock(i*5000)+'–'+clock((i+1)*5000)+'</small></div>').join(""))+'</div></div>';const audio=kind=>'<div class="track-row" data-track="'+kind+'"><div class="track-name">'+(kind==="voice"?"配音":"背景音乐")+'</div><div class="track-lane" data-drop="'+kind+'">'+(state.clips.filter(c=>c.kind===kind).length?state.clips.filter(c=>c.kind===kind).map(c=>'<div class="audio-clip '+kind+(c.id===state.selected?" selected":"")+'" data-id="'+esc(c.id)+'" style="left:'+(c.start/total*100)+'%;width:'+(duration(c)/total*100)+'%" title="'+esc(c.name)+'，起点 '+sec(c.start)+' 秒"><span class="grip" data-handle="left"></span><span class="body"><strong>'+esc(c.name)+'</strong>'+wave()+'</span><span class="grip" data-handle="right"></span></div>').join(""):'<span class="empty-lane">从左侧拖入'+(kind==="voice"?"录音":"音乐")+'，或点击素材加入播放头处</span>')+'</div></div>';$("tracks").innerHTML=ruler+visuals+'<div class="track-row"><div class="track-name">镜头原声</div><div class="track-lane"><button class="tiny" data-action="toggle-original" style="margin:15px 8px;background:#3b4b4e;color:#fff;border-color:#637374">原声 ' + Math.round(state.sourceVolume*100) + '% · 点击静音/恢复</button></div></div>'+audio("voice")+audio("music")+'<div class="playhead" id="playhead"></div>';$("tracks").style.width=state.zoom===1.5?"900px":"";updatePlayhead()}
    function renderPreview(){const scene=Math.min(2,Math.floor(state.time/5000));const s=scenes[scene];$("video-stage").innerHTML='<span class="stage-label">'+(state.empty?"暂无镜头":esc(s.name))+'</span>'+(state.empty?'<div style="color:#c7d3cd;text-align:center;padding:20px">画布中还没有可预览的镜头</div>':'<div class="frame scene-'+scene+'"><span class="window"></span><span class="lamp"></span><span class="character">'+s.emoji+'</span><span class="prop">'+s.prop+'</span><span class="frame-caption">'+esc(s.caption)+'</span></div>')+'<span class="stage-hint">示意画面 · 非真实视频</span>';$("current-time").textContent=clock(state.time);$("scrubber").value=state.time;$("viewer-meta").textContent=(state.empty?"0":"3")+" 个镜头 · "+(state.empty?"0.0":"15.0")+" 秒";$("play").textContent=state.playing?"Ⅱ":"▶"}
    function updatePlayhead(){const p=$("playhead");if(p)p.style.left='calc(78px + (100% - 78px) * '+(state.time/total)+')'}
    function renderInspector(){const c=selected();$("inspector-content").innerHTML=!c?'<div class="empty"><strong>选择一个音频片段</strong><p>点击时间线里的配音或音乐，调整位置和音量。</p></div>':'<div class="selected-title">'+esc(c.kind==="voice"?"配音 · ":"音乐 · ")+esc(c.name)+'</div><div class="row"><label class="field">在影片中开始（秒）<input data-field="start" type="number" min="0" max="15" step="0.1" value="'+sec(c.start)+'"></label><label class="field">片段长度（秒）<input value="'+sec(duration(c))+'" disabled></label></div><div class="row"><label class="field">录音入点（秒）<input data-field="inMs" type="number" min="0" step="0.1" value="'+sec(c.inMs)+'"></label><label class="field">录音出点（秒）<input data-field="outMs" type="number" min="0.1" step="0.1" value="'+sec(c.outMs)+'"></label></div><label class="field">音量（%）<input data-field="volume" type="number" min="0" max="200" step="1" value="'+Math.round(c.volume*100)+'"></label>'+(c.kind==="voice"?'<label class="field">跟随方式<select data-field="anchor"><option value="shot-1" '+(c.anchor==="shot-1"?"selected":"")+'>跟随镜头 1</option><option value="shot-2" '+(c.anchor==="shot-2"?"selected":"")+'>跟随镜头 2</option><option value="shot-3" '+(c.anchor==="shot-3"?"selected":"")+'>跟随镜头 3</option><option value="episode" '+(c.anchor==="episode"?"selected":"")+'>固定在整集时间</option></select><small>旧项目配音默认按整集时间保留。</small></label>':'')+'<div class="inspector-actions"><button data-action="delete">从时间线移除</button><button data-action="show-source">查看原始素材</button></div><div class="callout">拖动色块改变位置，拖两端改变截取范围；原始录音始终保留。</div>'}
    function updateButtons(){$("undo").disabled=!state.history.length;$("redo").disabled=!state.future.length}
    function render(){renderAssets();renderTracks();renderPreview();renderInspector();updateSave();updateButtons();$("offline-button").textContent=state.offline?"恢复网络并保存":"模拟断网保存"}
    function modal(title,body,buttons){$("modal-root").innerHTML='<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2>'+body+'<div class="actions">'+buttons+'</div></section></div>';$("modal-root").querySelector("button")?.focus()}
    function closeModal(){$("modal-root").innerHTML=""}
    function addAudio(assetId,start){const asset=state.assets.find(a=>a.id===assetId);if(!asset||state.empty){notify("请先在画布加入镜头，再添加配音。");return}const remaining=total-start;if(remaining<300){notify("播放头离结尾太近，请选择更早的位置。");return}const add=length=>change(()=>{const clip={id:"clip-"+crypto.randomUUID(),assetId:asset.id,kind:asset.kind,name:asset.name,start,inMs:0,outMs:length,volume:asset.kind==="music"?.35:1,anchor:asset.kind==="music"?"episode":"shot-"+(Math.min(2,Math.floor(start/5000))+1)};state.clips.push(clip);state.selected=clip.id});if(asset.duration>remaining){state.pendingAsset={assetId,start,remaining};modal("音频超出整集结尾",'<p>放在 '+sec(start)+' 秒时只剩 '+sec(remaining)+' 秒。原始录音不会改变；可以只在本集使用前 '+sec(remaining)+' 秒。</p>','<button data-action="modal-close">取消</button><button class="primary" data-action="trim-add">裁到结尾并加入</button>');return}add(asset.duration)}
    function togglePlay(){if(state.empty){notify("请先从画布加入镜头。");return}if(state.playing){clearInterval(state.timer);state.playing=false;renderPreview();return}if(state.time>=total)state.time=0;state.playing=true;state.timer=setInterval(()=>{state.time=clamp(state.time+100,0,total);renderPreview();updatePlayhead();if(state.time>=total)togglePlay()},100);renderPreview()}
    document.addEventListener("click",e=>{const b=e.target.closest("[data-action],[data-asset]");if(!b)return;if(b.dataset.asset){addAudio(b.dataset.asset,snap(state.time));return}const a=b.dataset.action;if(a==="play"){togglePlay();return}if(a==="undo"){if(!state.history.length)return;state.future.push(snapshot());state.clips=state.history.pop();state.selected=state.clips[0]?.id??null;markSave();render();return}if(a==="redo"){if(!state.future.length)return;state.history.push(snapshot());state.clips=state.future.pop();state.selected=state.clips[0]?.id??null;markSave();render();return}if(a==="delete"){const c=selected();if(!c)return;change(()=>{state.clips=state.clips.filter(x=>x.id!==c.id);state.selected=null});notify("已从时间线移除；原始素材仍在素材库。");return}if(a==="show-source"){notify("原始素材仍保留在左侧素材库。");return}if(a==="back"){modal("返回画布",'<p>正式产品会返回当前分集画布。原型留在此页；保存失败时应先提醒用户保留本地草稿。</p>','<button class="primary" data-action="modal-close">继续编辑</button>');return}if(a==="toggle-original"){state.sourceVolume=state.sourceVolume?0:1;markSave();renderTracks();notify(state.sourceVolume?"镜头原声已恢复。":"镜头原声已静音。");return}if(a==="agent"){modal("Agent 剪辑建议",'<p>已有 Agent 剪辑建议应迁到整集剪辑工作台，按当前时间线修订生成建议；用户逐条查看差异并确认，不自动导出、不自动付费。</p><p>原型不调用模型。</p>','<button class="primary" data-action="modal-close">知道了</button>');return}if(a==="precise"){modal("精准预览",'<p>正式产品会使用已保存的时间线快照请求服务端合成预览，并展示任务状态与可播放成片。它用于检查即时试听和导出是否一致。</p><p><strong>本原型不会请求服务器，也不会生成视频或声音。</strong></p>','<button class="primary" data-action="modal-close">知道了</button>');return}if(a==="export"){modal("导出成片",'<p>正式产品仅在草稿已保存且精准预览成功后允许导出。本原型不生成 MP4。</p><p>当前示例：3 个镜头、'+state.clips.filter(c=>c.kind==="voice").length+' 段配音、'+state.clips.filter(c=>c.kind==="music").length+' 段音乐。</p>','<button class="primary" data-action="modal-close">知道了</button>');return}if(a==="upload-voice"||a==="upload-music"){const input=$("file-input");input.dataset.kind=a==="upload-voice"?"voice":"music";input.click();return}if(a==="tts"){modal("文字生成配音",'<p>正式产品会在这里填写文案、选择声音并先查看费用说明。用户再次确认后才可能提交付费任务；成功的录音进入左侧素材库，由用户拖到时间线。</p><textarea id="tts-text" placeholder="例如：晚餐做好啦，上菜！"></textarea><select id="tts-voice"><option>中文温暖女声</option><option>中文活力男声</option></select><p>原型只演示交互，不调用模型或扣费。</p>','<button data-action="modal-close">取消</button><button class="primary" data-action="tts-confirm">查看费用说明</button>');return}if(a==="tts-confirm"){const value=$("tts-text")?.value.trim();if(!value){notify("请先填写配音文案。");$("tts-text")?.focus();return}modal("确认生成配音",'<p>配音文案：'+esc(value)+'</p><p>正式产品需要显示真实费用说明并单独确认；若无法报价，必须说明按供应商实际用量扣费。本原型确认后只添加一个模拟资产。</p>','<button data-action="modal-close">取消</button><button class="primary" data-action="tts-add">模拟生成并加入素材库</button>');return}if(a==="tts-add"){state.assets.push({id:"asset-"+crypto.randomUUID(),kind:"voice",name:"模拟文字配音.wav",duration:3200});closeModal();renderAssets();notify("模拟配音已加入素材库，请拖到时间线；没有真实付费请求。");return}if(a==="trim-add"){const p=state.pendingAsset;closeModal();if(p){const asset=state.assets.find(x=>x.id===p.assetId);if(asset)change(()=>{const c={id:"clip-"+crypto.randomUUID(),assetId:asset.id,kind:asset.kind,name:asset.name,start:p.start,inMs:0,outMs:p.remaining,volume:1,anchor:"episode"};state.clips.push(c);state.selected=c.id});state.pendingAsset=null}return}if(a==="modal-close"){closeModal();state.pendingAsset=null;return}if(a==="empty"){if(state.playing){clearInterval(state.timer);state.playing=false}state.empty=true;state.clips=[];state.selected=null;state.time=0;render();return}if(a==="reset"){if(state.playing){clearInterval(state.timer);state.playing=false}state.empty=false;state.assets=structuredClone(initialAssets);state.clips=structuredClone(initialClips);state.selected="clip-a";state.time=0;state.history=[];state.future=[];state.save="已保存";render();return}if(a==="offline"){state.offline=!state.offline;if(!state.offline&&state.save==="保存失败")markSave();render();return}if(a==="zoom"){state.zoom=state.zoom===1?1.5:1;document.querySelector(".tracks").style.width=state.zoom===1.5?"900px":"";b.textContent="缩放 "+Math.round(state.zoom*100)+"%";return}});
    document.addEventListener("change",e=>{if(e.target.id==="file-input"){const file=e.target.files?.[0];if(!file)return;const kind=e.target.dataset.kind||"voice";if(!/\.(wav|mp3|m4a)$/i.test(file.name)){notify("请选择 WAV、MP3 或 M4A 音频。");return}state.assets.push({id:"asset-"+crypto.randomUUID(),kind,name:file.name,duration:5000});renderAssets();notify("原型已把文件名加入素材库；未上传到服务器。");e.target.value="";return}if(e.target.id==="scrubber"){state.time=Number(e.target.value);renderPreview();updatePlayhead();return}if(e.target.dataset.field){const clip=selected();if(!clip)return;const field=e.target.dataset.field;const n=field==="anchor"?e.target.value:Number(e.target.value)*(field==="volume"?0.01:1000);if(field!=="anchor"&&!Number.isFinite(n)){notify("请输入有效数字。");renderInspector();return}const next={...clip,[field]:n};if(next.start<0||next.start+duration(next)>total||next.inMs<0||next.outMs<=next.inMs||next.volume<0||next.volume>2){notify("时间或音量超出有效范围，改动未保存。");renderInspector();return}change(()=>{Object.assign(clip,{[field]:n})});return}});
    document.addEventListener("input",e=>{if(e.target.id==="scrubber"){state.time=Number(e.target.value);renderPreview();updatePlayhead()}});
    document.addEventListener("dragstart",e=>{const a=e.target.closest("[data-asset]");if(a)e.dataTransfer.setData("text/plain",a.dataset.asset)});
    document.addEventListener("dragover",e=>{if(e.target.closest("[data-drop]"))e.preventDefault()});
    document.addEventListener("drop",e=>{const lane=e.target.closest("[data-drop]");if(!lane)return;e.preventDefault();const id=e.dataTransfer.getData("text/plain");const asset=state.assets.find(a=>a.id===id);if(!asset||asset.kind!==lane.dataset.drop){notify("请把录音放在配音轨，音乐放在音乐轨。");return}const rect=lane.getBoundingClientRect();addAudio(id,snap(clamp((e.clientX-rect.left)/rect.width*total,0,total)))});
    document.addEventListener("pointerdown",e=>{const c=e.target.closest(".audio-clip");if(!c)return;const clip=state.clips.find(x=>x.id===c.dataset.id);if(!clip)return;state.selected=clip.id;renderInspector();const lane=c.parentElement;drag={id:clip.id,mode:e.target.dataset.handle||"move",x:e.clientX,width:lane.getBoundingClientRect().width,original:{...clip},before:snapshot(),changed:false};e.preventDefault()});
    document.addEventListener("pointermove",e=>{if(!drag)return;const c=state.clips.find(x=>x.id===drag.id);if(!c)return;const delta=Math.round((e.clientX-drag.x)/drag.width*total/100)*100;const o=drag.original;if(drag.mode==="move")c.start=snap(clamp(o.start+delta,0,total-duration(o)));if(drag.mode==="left"){const max=o.outMs-o.inMs-300;const d=clamp(delta,-o.inMs,max);c.start=snap(clamp(o.start+d,0,total-300));c.inMs=o.inMs+c.start-o.start}if(drag.mode==="right")c.outMs=clamp(o.outMs+delta,o.inMs+300,o.inMs+total-o.start);drag.changed=JSON.stringify(c)!==JSON.stringify(o);renderTracks()});
    document.addEventListener("pointerup",()=>{if(!drag)return;if(drag.changed){state.history.push(drag.before);state.future=[];markSave();renderInspector();updateButtons()}drag=null});
    document.addEventListener("click",e=>{if(e.target.id==="ruler"||e.target.classList.contains("tick")){const r=$("ruler").getBoundingClientRect();state.time=snap(clamp((e.clientX-r.left)/r.width*total,0,total));renderPreview();updatePlayhead()}});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();return}if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)){const c=selected();if(!c)return;e.preventDefault();const dir=e.key==="ArrowLeft"?-100:100;change(()=>{c.start=clamp(c.start+dir,0,total-duration(c))})}});
    render();
  </script>
</body>
</html>
