<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Video Studio｜一句念头到 15 秒微故事 · 交互原型</title>
  <style>
    :root{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#282927;background:#f4f0e9;--paper:#fffdf9;--cream:#f4f0e9;--ink:#282927;--muted:#6b6b65;--line:#d8d0c5;--rust:#a65338;--rust-dark:#843e2c;--mint:#dbe9e0;--teal:#315b5a;--night:#252e2f;--gold:#d9ba82}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.44}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #c26f4a;outline-offset:3px}input,textarea{color:var(--ink)}
    .shell{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}.rail{background:#e9e2d8;border-right:1px solid #cbbeb0;padding:25px 17px;display:flex;flex-direction:column;gap:22px}.brand{font-size:19px;font-weight:800;letter-spacing:-.04em;color:var(--rust-dark);display:flex;align-items:center;gap:9px}.brand-mark{font-size:25px}.rail-title{font-size:12px;color:#70685e;margin-top:25px;padding:0 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#5f5d58;padding:12px 14px;text-align:left;border-radius:8px;font-weight:650}.nav button.active{color:var(--rust-dark);background:#f9eee3;box-shadow:inset 3px 0 var(--rust)}.rail-foot{margin-top:auto;border-top:1px solid #cbbeb0;padding-top:18px;color:#655e56;font-size:12px;line-height:1.6}.rail-foot strong{display:block;color:var(--rust-dark);margin-bottom:4px}
    .body{min-width:0}.topbar{height:70px;border-bottom:1px solid var(--line);background:#faf7f2;display:flex;align-items:center;justify-content:space-between;padding:0 42px;gap:15px}.crumb{font-size:13px;color:#5d605c}.demo-badge{border:1px solid #c8b6a1;background:#fff9f0;color:#7b5139;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap}.main{max-width:1370px;margin:0 auto;padding:36px 42px 90px}.steps{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:32px}.steps button{border:0;background:none;color:#807c76;font-size:12px;font-weight:700;padding:8px 11px;border-radius:7px}.steps button.active{background:#e8d3bd;color:#6c3829}.steps button.done{color:var(--teal)}.steps .bar{height:1px;width:21px;background:#c9c0b5}.kicker{font-size:13px;font-weight:800;color:var(--rust-dark);margin:0 0 8px}.title{font-size:clamp(31px,4vw,56px);letter-spacing:-.055em;line-height:1.14;margin:0 0 15px;font-weight:750}.intro{font-size:16px;color:#636660;line-height:1.75;max-width:740px;margin:0 0 28px}.actions{display:flex;gap:11px;flex-wrap:wrap;align-items:center}.btn{border:1px solid transparent;border-radius:10px;padding:13px 19px;font-weight:750;min-height:46px}.btn.primary{color:#fff;background:var(--rust)}.btn.primary:hover:not(:disabled){background:var(--rust-dark)}.btn.secondary{background:var(--paper);border-color:#cdbdac;color:var(--rust-dark)}.btn.ghost{background:transparent;border-color:transparent;color:#5d615d}.btn.small{font-size:13px;padding:8px 12px;min-height:34px}.btn.danger{background:#fff6f1;border-color:#dfbaa9;color:#933d2d}.helper{font-size:12px;color:#6d6a63;line-height:1.6}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px}.pad{padding:26px}.hero-layout{display:grid;grid-template-columns:minmax(0,1.38fr) minmax(250px,.7fr);gap:24px;align-items:start}.input-label{display:block;font-weight:750;margin-bottom:10px}.main-input{width:100%;min-height:175px;border:1px solid #cbbdae;border-radius:10px;background:#fffdfa;padding:17px 18px;font-size:17px;line-height:1.6;resize:vertical}.charline{display:flex;justify-content:space-between;gap:15px;color:#7a746c;font-size:12px;margin:10px 0 20px}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.example{border:1px solid #d1c6b9;background:#f9f4ec;color:#705c4e;border-radius:99px;padding:7px 12px;font-size:12px}.side-note{padding:25px;background:#e8ebdf;border-radius:14px;min-height:306px;display:flex;flex-direction:column}.side-note h2{font-size:20px;letter-spacing:-.03em;margin:8px 0 11px}.side-note p{font-size:14px;line-height:1.8;color:#4d5c55;margin:0}.side-note .metric{margin-top:auto;border-top:1px solid #bdc9bc;padding-top:19px;color:#294c4b}.side-note .metric strong{font-size:30px;letter-spacing:-.05em}.film-ribbon{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#222b2b;padding:13px;border-radius:13px;margin-top:30px}.frame{min-height:122px;border-radius:5px;background:#677d79;position:relative;overflow:hidden}.frame::before{content:"";width:110px;height:110px;border-radius:50%;position:absolute;left:50%;top:15%;background:#f4d5a0;filter:blur(22px);opacity:.8}.frame:nth-child(2){background:#9b6c57}.frame:nth-child(3){background:#5d7479}.frame span{position:absolute;left:13px;bottom:12px;color:white;font-size:12px;font-weight:750;text-shadow:0 1px 3px #0008}.frame em{font-size:34px;font-style:normal;position:absolute;right:15px;top:17px;opacity:.9}
    .story-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:26px 0 22px}.story-card{border:1px solid var(--line);background:var(--paper);padding:20px;text-align:left;border-radius:12px;min-height:335px;color:var(--ink);display:flex;flex-direction:column}.story-card.selected{border-color:var(--rust);box-shadow:inset 0 0 0 1px var(--rust);background:#fff9f2}.story-card:hover{border-color:#b97153}.story-card small{font-size:11px;color:var(--rust-dark);font-weight:800}.story-card h2{font-size:21px;line-height:1.25;margin:12px 0 10px;letter-spacing:-.035em}.story-card p{font-size:13px;line-height:1.65;color:#5d625d;margin:0 0 14px}.beats{display:grid;gap:7px;margin-top:auto}.beats span{font-size:12px;color:#59625d;padding-left:13px;border-left:2px solid #c8d3ca}.pick{font-size:13px;font-weight:800;color:var(--rust-dark);margin-top:15px}.detailbar{display:flex;justify-content:space-between;gap:20px;align-items:center;background:#eee7de;border:1px solid #d8cab9;padding:17px 20px;border-radius:10px;margin:0 0 20px}.detailbar strong{color:#544c45}.detailbar span{font-size:12px;color:#6e645b}.field{display:grid;gap:7px;font-size:13px;font-weight:700;color:#4f514e}.field input,.field textarea{border:1px solid #cdbfb1;background:#fffdfa;border-radius:8px;padding:11px 12px;width:100%}.field textarea{min-height:95px;resize:vertical;line-height:1.6}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.choice{border:1px solid var(--line);border-radius:11px;background:var(--paper);padding:18px;text-align:left;color:var(--ink)}.choice.active{border-color:var(--rust);background:#fff8ef;box-shadow:inset 0 0 0 1px var(--rust)}.choice strong{display:block;margin-bottom:8px}.choice span{font-size:13px;color:var(--muted);line-height:1.6}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:25px 0}.stack{display:grid;gap:15px}.muted-panel{background:#f5efe7;border:1px solid #e0d3c5;border-radius:10px;padding:16px;font-size:13px;color:#615c55;line-height:1.7}
    .board-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.75fr);gap:17px;align-items:start}.canvas{background:var(--night);color:#f5efe5;border-radius:14px;min-height:370px;padding:20px;position:relative;overflow:hidden;background-image:radial-gradient(#798b803f .7px,transparent .7px);background-size:17px 17px}.canvas-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:33px;color:#d9d9cd;font-size:12px}.canvas-header strong{font-size:16px;color:#fff}.node-flow{display:grid;grid-template-columns:.65fr 1fr 1fr 1fr .8fr;gap:10px;align-items:center}.node{border:1px solid #8c9b90;background:#f6f0e7;color:#27302e;border-radius:8px;padding:12px;min-height:120px;position:relative;display:flex;flex-direction:column;gap:7px}.node:after{content:"";position:absolute;right:-10px;top:50%;width:10px;border-top:2px solid var(--gold)}.node:last-child:after{display:none}.node b{font-size:11px;color:#91604d}.node strong{font-size:14px;line-height:1.35}.node span{font-size:11px;color:#5d635f;line-height:1.4}.node.story{background:#dfe8dd}.node.shot{border-top:4px solid #d6a479}.node.timeline{background:#d6e5e5}.canvas-foot{position:absolute;bottom:16px;left:20px;right:20px;border-top:1px solid #687675;padding-top:12px;font-size:11px;color:#becbc3;display:flex;justify-content:space-between}.shot-list{display:grid;gap:10px}.shot-row{border:1px solid var(--line);border-radius:9px;padding:13px;background:var(--paper)}.shot-row h3{font-size:14px;margin:0 0 7px}.shot-row p{font-size:12px;color:#63635e;line-height:1.6;margin:0 0 9px}.shot-row button{font-size:12px}.status-chip{font-size:11px;border-radius:99px;padding:5px 8px;background:#e2e8df;color:#3d6555;font-weight:750}.notice{margin:18px 0;padding:13px 16px;border-left:3px solid var(--rust);background:#f3e8de;color:#755642;font-size:13px;line-height:1.65}.notice.error{border-color:#b44c43;background:#fbebea;color:#81372f}.board-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}.bill{width:100%;border-collapse:collapse;background:var(--paper);border-radius:10px;overflow:hidden}.bill th,.bill td{padding:14px 16px;border-bottom:1px solid #e3dad0;text-align:left;font-size:13px}.bill th{background:#eae3d8;color:#55564f}.bill td:last-child,.bill th:last-child{text-align:right}.total{display:flex;justify-content:space-between;padding:21px 16px;font-size:18px;font-weight:800;background:#e8ecdf}.quote-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:17px}.quote-aside{background:#e6ece6;border-radius:11px;padding:24px}.quote-aside strong{display:block;font-size:18px;margin-bottom:12px}.quote-aside p{font-size:13px;line-height:1.8;color:#52645a}.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;color:#4b534e;margin:18px 0}.check input{margin-top:4px;accent-color:var(--rust)}.progress-list{display:grid;gap:12px;max-width:780px;margin:24px 0}.progress-row{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:16px;padding:18px;border:1px solid var(--line);background:var(--paper);border-radius:10px}.progress-row strong{font-size:14px}.progress-row span{font-size:12px;color:#5f665f}.progress-row .status-chip.failed{background:#fae6e1;color:#9a4035}.progress-row .status-chip.running{background:#f4ead5;color:#8a622d}.preview{background:#242d2e;border-radius:13px;color:#fff;min-height:335px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}.preview:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:#c99c6d;filter:blur(70px);opacity:.6}.preview>*{position:relative}.preview h2{font-size:34px;letter-spacing:-.04em;margin:0 0 9px}.preview p{color:#e2e7df;margin:0 0 20px}.preview .play{border:1px solid #ffffff8c;background:#fffdf8;color:#2b3030;border-radius:50%;width:58px;height:58px;font-size:20px}.final-grid{display:grid;grid-template-columns:1.35fr .75fr;gap:17px}.final-side{padding:24px}.final-side h2{margin:0 0 13px;font-size:20px}.final-side p{font-size:13px;line-height:1.7;color:#626963}.modal-wrap{position:fixed;inset:0;background:#161b1bb8;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{max-width:510px;width:100%;background:var(--paper);border-radius:14px;padding:27px;box-shadow:0 30px 80px #0005}.modal h2{margin:0 0 10px}.modal p{font-size:14px;line-height:1.75;color:#575e57}.modal .actions{justify-content:flex-end;margin-top:22px}.hidden{display:none!important}
    @media(max-width:1100px){.node-flow{grid-template-columns:1fr 1fr 1fr}.node.story,.node.timeline{display:none}.node:nth-last-child(2):after{display:none}.board-layout,.quote-layout,.final-grid{grid-template-columns:1fr}}
    @media(max-width:850px){.shell{grid-template-columns:1fr}.rail{padding:12px 18px;flex-direction:row;align-items:center;gap:12px}.rail-title,.rail-foot{display:none}.nav{display:flex}.nav button{padding:9px 11px}.topbar{padding:0 18px}.main{padding:24px 18px 70px}.hero-layout,.story-grid,.setup-grid,.choice-grid{grid-template-columns:1fr}.story-card{min-height:260px}.side-note{min-height:auto}.film-ribbon .frame{min-height:100px}.node-flow{grid-template-columns:1fr;gap:9px}.node{min-height:70px}.node:after{top:auto;bottom:-10px;left:50%;height:10px;width:0;border-top:0;border-left:2px solid var(--gold)}.node:nth-last-child(2):after{display:none}.canvas{min-height:420px}.progress-row{grid-template-columns:1fr auto}.progress-row>span:first-child{grid-column:1/-1}}
    @media(max-width:520px){.brand{font-size:15px}.topbar{height:56px}.steps{gap:2px}.steps .bar{width:7px}.steps button{padding:7px 5px;font-size:11px}.title{font-size:33px}.film-ribbon{gap:4px;padding:6px}.film-ribbon .frame{min-height:86px}.frame em{font-size:22px}.frame span{font-size:10px}.detailbar{align-items:flex-start;flex-direction:column}.bill th,.bill td{padding:10px 7px;font-size:11px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="rail"><div class="brand"><span class="brand-mark">✦</span>AI Video Studio</div><div class="rail-title">故事工作台</div><nav class="nav" aria-label="原型导航"><button data-action="home" id="nav-home" class="active">首页</button><button data-action="board" id="nav-board">画布</button><button data-action="result" id="nav-result">结果</button></nav><div class="rail-foot"><strong>交互原型</strong>演示数据，不调用模型、不生成视频、不产生费用。</div></aside>
  <div class="body"><header class="topbar"><span class="crumb" id="crumb">首页 / 从一个念头开始</span><span class="demo-badge">原型演示 · 不是线上能力</span></header><main class="main"><div class="steps" id="steps"></div><div id="view"></div></main></div>
</div>
<div id="modal-root"></div>
<script>
  const state={page:'home',idea:'',selected:-1,ownContent:false,storyTitle:'',projectMode:'new',projectName:'小狗的晚餐',projectExisting:'周末短片',shotTexts:[],reference:'Agent 自动准备',confirmed:false,progress:['待提交','待提交','待提交'],failure:false,played:false,notice:'',priceAcknowledged:false,modal:null};
  const order=['home','stories','setup','board','quote','progress','result'];
  const names={home:'想法',stories:'选创意',setup:'建项目',board:'画布分镜',quote:'确认拍摄',progress:'拍摄中',result:'成片'};
  const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const variants=()=>{const idea=state.idea.trim()||'小狗做饭并上菜';if(/植物|新芽|雨夜|枯萎/.test(idea))return [
    {title:'等一场雨',line:'一株快枯萎的植物，因一场夜雨迎来转机。',beats:['叶片垂下，花盆里的土干裂','夜雨落下，水珠慢慢渗入泥土','清晨新芽伸展，迎向第一束光'],style:'治愈 · 自然'},
    {title:'窗边的守候',line:'有人守着窗边的植物，直到雨夜带来惊喜。',beats:['主人看见植物枯萎，轻轻扶起叶子','雨夜把花盆移到窗边，雨滴落下','第二天发现新芽，露出笑容'],style:'温暖 · 生活'},
    {title:'一滴水的旅程',line:'用一滴雨水的视角讲述植物重生。',beats:['雨滴停在窗上，远处植物低垂','雨滴滑落到土里，根系吸收水分','新芽顶开泥土，画面迎来晨光'],style:'诗意 · 微距'}
  ];if(/小猫|迷路|小学生/.test(idea))return [
    {title:'回家的路',line:'一次放学路上的相遇，变成一场温柔护送。',beats:['小学生在路口发现迷路的小猫','沿着街道寻找线索，抱着猫穿过人群','小猫回到主人怀里，孩子挥手告别'],style:'写实 · 温暖'},
    {title:'纸盒里的求救声',line:'从一个纸盒里的声音开始，找到小猫的家。',beats:['孩子听见纸盒里传出轻轻的叫声','抱着小猫向附近的人询问','有人认出小猫，温暖重逢'],style:'明亮 · 轻喜剧'},
    {title:'橘色的线索',line:'一枚小铃铛，带着孩子找到猫主人。',beats:['孩子发现小猫脖子上的铃铛','跟着铃铛上的信息来到街角小店','店主认出小猫，开心接过'],style:'悬念 · 治愈'}
  ];if(!/小狗|做饭|下厨|上菜|料理/.test(idea))return [
    {title:'意外的开始',line:`围绕“${idea}”，从一次意外走向明确的结局。`,beats:[`让“${idea}”的主角与目标出现`,'出现阻碍，主角作出一次可见的选择','选择带来结果，故事在画面中收束'],style:'明快 · 叙事'},
    {title:'换一个视角',line:`从另一位观察者的角度讲述“${idea}”。`,beats:['观察者发现故事的主角','观察者见证关键变化','双方在结尾建立联系'],style:'温暖 · 写实'},
    {title:'结果先出现',line:`先露出“${idea}”的结果，再揭示它如何发生。`,beats:['用一个结果画面提出悬念','倒回关键动作揭示原因','返回结果，呈现完整意义'],style:'电影感 · 悬念'}
  ];return [
    {title:'意外的晚餐',line:`${idea}：从一场小意外，变成一顿温暖的晚餐。`,beats:['发现厨房里只剩下一点食材','认真烹饪，锅里冒出香气','端菜上桌，收获惊喜的笑容'],style:'温暖写实 · 轻喜剧'},
    {title:'厨房里的小英雄',line:`${idea}：主角接受挑战，用行动解决眼前难题。`,beats:['接到一份临时的做饭任务','手忙脚乱地完成关键一步','把作品送到伙伴面前'],style:'明快节奏 · 成长'},
    {title:'夜里的秘密菜单',line:`${idea}：一个安静的夜晚，藏着一份给朋友的心意。`,beats:['夜晚独自走进厨房','悄悄准备一份特别的料理','灯亮时端出惊喜'],style:'电影感 · 治愈'}
  ]};
  const current=()=>state.ownContent?{title:state.storyTitle||state.idea.slice(0,18),line:state.idea,beats:['从原文提取起因（Agent 待拆镜）','从原文提取关键变化（Agent 待拆镜）','从原文提取结果（Agent 待拆镜）'],style:'遵循用户原文'}:variants()[Math.max(0,state.selected)];
  const defaultShots=()=>current().beats.map((beat,i)=>`${beat}。保持同一主角与场景风格；${['中景建立情境','近景捕捉动作','中近景呈现结果'][i]}，自然连续的 5 秒镜头。`);
  const stepper=()=>{const currentIndex=order.indexOf(state.page);return ['home','stories','board','quote','progress','result'].map((p,i)=>`${i?'<span class="bar"></span>':''}<button type="button" data-action="step" data-page="${p}" ${order.indexOf(p)>currentIndex?'disabled':''} class="${p===state.page?'active':order.indexOf(p)<currentIndex?'done':''}">${names[p]}</button>`).join('')};
  const ribbon=()=>`<div class="film-ribbon" aria-label="微故事三镜头示意"><div class="frame"><em>✦</em><span>0–5s · 起因</span></div><div class="frame"><em>♨</em><span>5–10s · 变化</span></div><div class="frame"><em>✧</em><span>10–15s · 结果</span></div></div>`;
  function home(){return `<section class="hero-layout"><div><p class="kicker">一句话，也能有开头和结尾</p><h1 class="title">说出一个念头，<br>让 Agent 把它拍成故事。</h1><p class="intro">你选创意、确认分镜和费用；Agent 把三段画面拍成一条 15 秒微故事。这个页面演示未来的产品流程。</p><div class="card pad"><label class="input-label" for="idea">写下一个念头、关键词或剧本</label><textarea id="idea" class="main-input" placeholder="例如：小狗第一次下厨，最后端出一盘菜">${safe(state.idea)}</textarea><div class="charline"><span>找灵感建议 1–200 字；已有剧本最多 10000 字</span><span id="count">${state.idea.length} / 10000 字</span></div><div class="examples"><button class="example" data-action="example" data-text="小狗第一次下厨，最后端出一盘菜">小狗第一次下厨</button><button class="example" data-action="example" data-text="一株快枯萎的植物在雨夜重新长出新芽">雨夜里的新芽</button><button class="example" data-action="example" data-text="一位小学生把迷路的小猫送回家">迷路的小猫</button></div><div class="actions"><button class="btn primary" data-action="generate-stories">让 Agent 拍成故事</button><button class="btn secondary" data-action="own-content">用我的内容开始</button></div><p class="helper">故事和分镜预览不触发视频拍摄；真正拍摄前会列出每个镜头及总费用。</p></div></div><aside class="side-note"><p class="kicker">给第一次拍故事的人</p><h2>先看清故事，再决定要不要拍。</h2><p>Agent 提供三篇有起因、变化和结果的故事。选定后自动放到同一集画布里；你想细改时，再打开画布。</p><div class="metric"><strong>3 × 5s</strong><br>建议首发的 15 秒微故事</div></aside></section>${ribbon()}`}
  function stories(){return `<p class="kicker">第 1 次选择 · 选故事</p><h1 class="title">同一个念头，三种讲法。</h1><p class="intro">以下内容是原型示意。正式产品会由真实 Agent 生成三篇完整故事，并保存你的原始输入。</p><div class="detailbar"><strong>你的念头：${safe(state.idea)}</strong><span>仅生成文字方案，不拍视频</span></div><div class="story-grid">${variants().map((v,i)=>`<button class="story-card ${state.selected===i?'selected':''}" data-action="select-story" data-index="${i}" aria-pressed="${state.selected===i}"><small>故事方向 ${i+1} · 预计 15 秒</small><h2>${safe(v.title)}</h2><p>${safe(v.line)}</p><div class="beats">${v.beats.map((b,j)=>`<span>${['起因','变化','结果'][j]}：${safe(b)}</span>`).join('')}</div><span class="pick">${state.selected===i?'✓ 已选中':'选择这篇'}</span></button>`).join('')}</div><div class="actions"><button class="btn primary" data-action="continue-story" ${state.selected<0?'disabled':''}>选这篇继续</button><button class="btn secondary" data-action="regenerate">换三篇故事</button><button class="btn ghost" data-action="home">返回修改想法</button></div><p class="helper">“换三篇故事”在原型中只重置选中态；正式产品会发起新的文字请求，不产生视频费用。</p>`}
  function setup(){return `<p class="kicker">给故事一个归属</p><h1 class="title">放进一个项目，再开始分镜。</h1><p class="intro">你的输入原文和选中的故事会同时保存。创建项目不会触发视频拍摄。</p><div class="detailbar"><strong>${safe(state.storyTitle||current().title)}</strong><span>原文：${safe(state.idea)}</span></div><div class="setup-grid"><div class="card pad"><h2>项目</h2><div class="choice-grid"><button class="choice ${state.projectMode==='new'?'active':''}" data-action="project-new"><strong>＋ 新建项目</strong><span>把这条故事放在独立的项目中。</span></button><button class="choice ${state.projectMode==='existing'?'active':''}" data-action="project-existing"><strong>加入已有项目</strong><span>保留已有分集，新增故事记录。</span></button></div>${state.projectMode==='new'?`<label class="field">项目名称<input id="project-name" maxlength="50" value="${safe(state.projectName)}"></label>`:`<label class="field">选择项目<input id="project-existing" value="${safe(state.projectExisting)}" aria-label="已有项目"></label>`}</div><div class="card pad"><h2>制作方式</h2><div class="choice active"><strong>15 秒微故事 · 3 个镜头</strong><span>Agent 自动规划，拍摄前统一确认。</span></div><div class="choice" style="margin-top:10px"><strong>5 秒单镜头</strong><span>现有功能保留在创作页；本原型聚焦故事主路径。</span></div><p class="helper">桌面离线项目需登录并关联云端后才能从网页找到。</p></div></div><div class="actions"><button class="btn primary" data-action="create-project">创建并进入分镜</button><button class="btn ghost" data-action="stories">返回选故事</button></div>${state.notice?`<p class="notice error" role="status">${safe(state.notice)}</p>`:''}`}
  function graph(){return `<div class="canvas" aria-label="Agent 自动形成的分集画布示意"><div class="canvas-header"><strong>第 1 集 · ${safe(state.storyTitle)}</strong><span>Agent 已形成分镜 · 尚未拍摄</span></div><div class="node-flow"><div class="node story"><b>故事原文</b><strong>${safe(state.idea.slice(0,22))}${state.idea.length>22?'…':''}</strong><span>保留用户输入</span></div>${state.shotTexts.map((s,i)=>`<div class="node shot"><b>${i*5}–${(i+1)*5}s · ${['起因','变化','结果'][i]}</b><strong>${safe(current().beats[i])}</strong><span>视频节点 · 待拍摄</span></div>`).join('')}<div class="node timeline"><b>时间线</b><strong>15 秒初稿</strong><span>成功片段按序加入</span></div></div><div class="canvas-foot"><span>人物/参考 → 分镜 → 视频节点 → 时间线</span><span>连接本身不扣视频费用</span></div></div>`}
  function board(){return `<p class="kicker">第 2 次选择 · 审分镜</p><h1 class="title">Agent 已把故事放到画布。</h1><p class="intro">三张分镜按起因、变化、结果排列。你可以改镜头；不进画布也能继续拍摄。</p><div class="board-layout"><div>${graph()}<div class="notice">没有上传照片时，正式产品必须自动准备同一角色和画风的参考图。原型只展示这一步，不生成图片。</div></div><aside class="shot-list">${state.shotTexts.map((s,i)=>`<section class="shot-row"><h3>${i+1}. ${['起因','变化','结果'][i]} <span class="status-chip">待拍摄</span></h3><p>${safe(current().beats[i])}</p><button class="btn secondary small" data-action="edit-shot" data-index="${i}">修改分镜</button></section>`).join('')}<div class="muted-panel">主参考：${safe(state.reference)}<br>画布节点已创建；视频任务数：0</div></aside></div><div class="board-actions"><button class="btn primary" data-action="quote">确认分镜并查看费用</button><button class="btn secondary" data-action="canvas-detail">打开画布精修</button><button class="btn ghost" data-action="replan">重新规划分镜</button><button class="btn ghost" data-action="replace-ref">替换参考照片</button></div>${state.notice?`<p class="notice" role="status">${safe(state.notice)}</p>`:''}`}
  function quote(){return `<p class="kicker">第 3 次选择 · 确认费用</p><h1 class="title">确认后，Agent 才会开拍。</h1><p class="intro">本页是产品价格结构原型。¥39.9 是待真实成本审核的内测目标，不是当前收费或线上报价。</p><div class="quote-layout"><div class="card"><table class="bill"><thead><tr><th>镜头</th><th>时长</th><th>状态</th><th>目标展示</th></tr></thead><tbody>${['起因','变化','结果'].map((s,i)=>`<tr><td>${i+1}. ${s}</td><td>5 秒</td><td>待拍摄</td><td>包含在总价</td></tr>`).join('')}</tbody></table><div class="total"><span>15 秒 · 三镜头目标价</span><span>¥39.9</span></div></div><aside class="quote-aside"><strong>本次授权范围</strong><p>只批准这三个镜头、当前分镜版本和列明的费用上限。主动重做或新增镜头，需要重新报价和确认。供应商任务状态不明时，只查询原任务。</p><p>参考图、文字 Agent、存储等真实成本尚待架构和财务核对；本原型不会收费。</p></aside></div><label class="check"><input type="checkbox" id="ack" ${state.priceAcknowledged?'checked':''}><span>我已看到 3 个 5 秒镜头和总预算；知道这是交互原型，不会实际拍摄或付款。</span></label><div class="actions"><button class="btn primary" data-action="start-shoot" ${state.priceAcknowledged?'':'disabled'}>确认拍摄 3 个镜头</button><button class="btn secondary" data-action="board">返回修改分镜</button></div>`}
  function progress(){const done=state.progress.filter(x=>x==='已完成').length;return `<p class="kicker">Agent 正在推进</p><h1 class="title">拍摄进度 ${done} / 3</h1><p class="intro">每个镜头都有自己的任务状态。断线后应查询原编号；状态未知时不重新提交。此处均为模拟进度。</p><div class="progress-list">${state.progress.map((p,i)=>`<div class="progress-row"><span>${i*5}–${(i+1)*5}s</span><strong>${['起因','变化','结果'][i]} · ${safe(current().beats[i])}</strong><span class="status-chip ${p==='失败'?'failed':p==='生成中'?'running':''}">${safe(p)}</span></div>`).join('')}</div>${state.failure?`<p class="notice error">第 2 镜失败；第 1、3 镜的结果会保留。新付费重做前须为第 2 镜重新报价。</p>`:''}<div class="actions"><button class="btn primary" data-action="simulate-next" ${state.failure?'disabled':''}>模拟下一镜完成</button><button class="btn secondary" data-action="simulate-all" ${state.failure?'disabled':''}>模拟三镜完成</button><button class="btn danger" data-action="simulate-fail">模拟第 2 镜失败</button><button class="btn ghost" data-action="query-original">查询原任务</button><button class="btn ghost" data-action="board">查看分镜</button><button class="btn ghost" data-action="completed-shots">查看已完成片段</button>${state.failure?'<button class="btn secondary" data-action="retry-failed">重试失败镜头</button>':''}</div><p class="helper">演示按钮只改变本页状态，不调用任何视频服务。</p>`}
  function result(){return `<p class="kicker">可播放初稿 · 原型示意</p><h1 class="title">一个念头，已经有了结尾。</h1><p class="intro">三镜头按顺序进入本集时间线。真实产品在这里播放生成的 MP4；本原型只展示占位画面。</p><div class="final-grid"><div><div class="preview" role="img" aria-label="15 秒微故事模拟预览"><h2 id="preview-title">${safe(state.storyTitle)}</h2><p id="preview-subtitle">0–5s · ${safe(current().beats[0])}</p><button class="play" data-action="play-demo" aria-label="模拟播放">▶</button></div>${ribbon()}</div><aside class="card final-side"><h2>第 1 集 · 15 秒</h2><p>已完成 3 个 5 秒镜头；原文、分镜、任务和选用版本应在同一项目中找回。</p><div class="stack"><button class="btn primary" data-action="export">导出 MP4</button><button class="btn secondary" data-action="retake">只重做第 2 镜</button><button class="btn secondary" data-action="canvas-detail">打开画布精修</button><button class="btn ghost" data-action="records">查看费用与任务记录</button></div><p class="helper">原型不生成真实视频；导出按钮会显示预期交互。</p></aside></div>`}
  function render(){document.getElementById('steps').innerHTML=stepper();document.getElementById('view').innerHTML=({home,stories,setup,board,quote,progress,result}[state.page])();document.getElementById('crumb').textContent=`${state.page==='home'?'首页':'故事工作台'} / ${names[state.page]}`;document.getElementById('nav-home').classList.toggle('active',state.page==='home');document.getElementById('nav-board').classList.toggle('active',state.page==='board');document.getElementById('nav-result').classList.toggle('active',state.page==='result');document.getElementById('modal-root').innerHTML=state.modal||'';window.scrollTo({top:0,behavior:'instant'})}
  const go=p=>{state.notice='';state.page=p;render()};
  const modal=(title,body,actions='')=>{state.modal=`<div class="modal-wrap" data-overlay="true"><section class="modal" role="dialog" aria-modal="true" aria-label="${safe(title)}"><h2>${safe(title)}</h2><p>${body}</p><div class="actions">${actions||'<button class="btn primary" data-action="close-modal">知道了</button>'}</div></section></div>`;render();document.querySelector('.modal button')?.focus()};
  document.addEventListener('input',e=>{if(e.target.id==='idea'){state.idea=e.target.value;document.getElementById('count').textContent=`${state.idea.length} / 10000 字`}if(e.target.id==='project-name')state.projectName=e.target.value;if(e.target.id==='project-existing')state.projectExisting=e.target.value;if(e.target.id==='ack'){state.priceAcknowledged=e.target.checked;document.querySelector('[data-action="start-shoot"]').disabled=!state.priceAcknowledged}});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){if(e.target.dataset?.overlay){state.modal=null;render()}return}const a=b.dataset.action;
    if(a==='close-modal'){state.modal=null;render();return}if(a==='step'){go(b.dataset.page);return}if(a==='home'){go('home');return}if(a==='stories'){go('stories');return}if(a==='board'){if(state.shotTexts.length)go('board');else modal('还没有分镜','先在首页输入想法并选一篇故事，Agent 才会建立分镜。');return}if(a==='result'){if(state.confirmed&&state.progress.every(x=>x==='已完成'))go('result');else modal('还没有成片','完成三镜头拍摄后，结果会出现在这里。');return}
    if(a==='example'){state.idea=b.dataset.text;render();document.getElementById('idea').focus();return}
    if(a==='generate-stories'){state.idea=document.getElementById('idea').value.trim();if(!state.idea){modal('先写下一句话','输入一个关键词或念头，Agent 才能提出故事方向。');return}if(state.idea.length>200){modal('找灵感最多 200 字','你的内容可以用“用我的内容开始”保存；也可以缩短后再让 Agent 提供故事方向。');return}state.ownContent=false;state.selected=-1;go('stories');return}
    if(a==='own-content'){state.idea=document.getElementById('idea').value.trim();if(!state.idea){modal('先写下一句话','输入关键词、提示词或剧本后才能继续。');return}state.ownContent=true;state.selected=0;state.storyTitle=state.idea.slice(0,18);state.projectName=state.storyTitle;go('setup');return}
    if(a==='select-story'){state.selected=Number(b.dataset.index);render();return}
    if(a==='regenerate'){state.selected=-1;modal('新一轮故事方案','正式产品会调用文字 Agent 获得新的三篇故事，并保存旧版本。本原型不调用模型。');return}
    if(a==='continue-story'){if(state.selected<0)return;state.storyTitle=current().title;state.projectName=current().title;go('setup');return}
    if(a==='project-new'){state.projectMode='new';render();return}if(a==='project-existing'){state.projectMode='existing';render();return}
    if(a==='create-project'){if(state.projectMode==='new'&&!state.projectName.trim()){state.notice='请先填写项目名称。';render();return}if(state.projectMode==='existing'&&!state.projectExisting.trim()){state.notice='请选择已有项目。';render();return}state.shotTexts=defaultShots();go('board');return}
    if(a==='edit-shot'){const i=Number(b.dataset.index);modal(`修改第 ${i+1} 镜`,`<label class="field">视频提示词<textarea id="shot-edit">${safe(state.shotTexts[i])}</textarea></label><p class="helper">保存会更新分镜版本，已确认的旧报价会失效。</p>`,`<button class="btn secondary" data-action="close-modal">取消</button><button class="btn primary" data-action="save-shot" data-index="${i}">保存分镜</button>`);return}
    if(a==='save-shot'){const i=Number(b.dataset.index);const value=document.getElementById('shot-edit').value.trim();if(!value){document.getElementById('shot-edit').focus();return}state.shotTexts[i]=value;state.priceAcknowledged=false;state.modal=null;state.notice=`第 ${i+1} 镜已修改；拍摄前将重新报价。`;render();return}
    if(a==='replan'){state.shotTexts=defaultShots();state.priceAcknowledged=false;state.notice='分镜已在原型中重置；正式产品会形成新修订，不产生视频任务。';render();return}
    if(a==='replace-ref'){modal('替换参考照片','正式产品允许上传自己的照片；如果没有照片，Agent 必须自动准备可用参考。原型不上传文件。');return}
    if(a==='canvas-detail'){modal('完整画布精修',`<div class="muted-panel">故事原文 → 三张文本分镜 → 三个待拍视频节点 → 时间线。当前页面中的深色画布即为节点关系示意；正式产品会进入可缩放、可编辑的同一集画布。</div>`);return}
    if(a==='quote'){state.priceAcknowledged=false;go('quote');return}
    if(a==='start-shoot'){if(!state.priceAcknowledged)return;state.confirmed=true;state.progress=['生成中','待提交','待提交'];go('progress');return}
    if(a==='simulate-next'){if(state.failure)return;const index=state.progress.findIndex(x=>x==='生成中');if(index>=0)state.progress[index]='已完成';const next=state.progress.findIndex(x=>x==='待提交');if(next>=0)state.progress[next]='生成中';if(state.progress.every(x=>x==='已完成'))go('result');else render();return}
    if(a==='simulate-all'){if(state.failure)return;state.progress=['已完成','已完成','已完成'];go('result');return}
    if(a==='simulate-fail'){state.progress[1]='失败';state.failure=true;render();return}
    if(a==='query-original'){modal('查询原任务','正式产品会用已经保存的镜头操作 ID 查询供应商状态，不会因为页面刷新或超时重新提交付费请求。');return}
    if(a==='completed-shots'){modal('已完成片段',`当前有 ${state.progress.filter(x=>x==='已完成').length} 个片段完成。正式产品可以单独预览成功片段，失败片段不会伪装成完整成片。`);return}
    if(a==='retry-failed'){modal('重试失败镜头','先查询原任务是否仍在生成；如需新付费任务，系统只对第 2 镜重新报价，经你确认后才提交。其他片段保持原样。');return}
    if(a==='play-demo'){state.played=true;let n=0;const labels=['起因','变化','结果'];const update=()=>{document.getElementById('preview-subtitle').textContent=`${n*5}–${(n+1)*5}s · ${current().beats[n]}`;n=(n+1)%3};update();const timer=setInterval(()=>{if(state.page!=='result'){clearInterval(timer);return}update()},1100);modal('模拟播放','画面是原型示意，不是视频生成结果。正式产品将在这里播放真实 15 秒 MP4。');return}
    if(a==='export'){modal('导出 MP4','正式产品会生成并下载可独立播放的 15 秒 MP4。本原型不生成文件，不会伪造导出成功。');return}
    if(a==='retake'){modal('只重做第 2 镜','正式产品会保留原片和其他两镜，先为第 2 镜重新报价，用户再次确认后才发起新的付费任务。');return}
    if(a==='records'){modal('费用与任务记录','正式产品展示本次三个镜头各自的操作 ID、供应商任务状态、报价与实际扣费。本原型没有真实任务和费用。');return}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
  render();
</script>
</body>
</html>
