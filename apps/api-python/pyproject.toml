[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-api"
version = "0.1.0"
description = "Python cloud API for AI Video Studio"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "psycopg[binary,pool]==3.3.7",
  "redis==8.1.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.3.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
